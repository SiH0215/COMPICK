<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">AI 견적 처리 흐름</title><desc id="desc">요구사항과 상품 카탈로그를 활용하여 추천을 생성하고 응답을 해석하여 견적으로 연결하는 흐름</desc><style>text{font-family:Malgun Gothic,Noto Sans KR,sans-serif} .title{font-size:26px;font-weight:700;fill:#172554} .label{font-size:20px;font-weight:700;fill:#1e3a8a} .body{font-size:15px;fill:#475569} .line{fill:none;stroke:#94a3b8;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs><rect width="1000" height="470" rx="24" fill="#f8fafc"/><text x="28" y="43" class="title">AI 추천을 상품 견적으로 연결합니다</text><rect x="272" y="65" width="212" height="96" rx="14" fill="#eff6ff" stroke="#cbd5e1"/><text x="378" y="98" text-anchor="middle" class="label">추천 근거</text><text x="378" y="124" text-anchor="middle" class="body">상품 CSV · 시스템 프롬프트</text><text x="378" y="145" text-anchor="middle" class="body"></text><rect x="28" y="190" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="134" y="223" text-anchor="middle" class="label">요구사항 입력</text><text x="134" y="249" text-anchor="middle" class="body">예산·용도를 자연어로 입력</text><text x="134" y="270" text-anchor="middle" class="body"></text><rect x="272" y="190" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="378" y="223" text-anchor="middle" class="label">Gemini 추천</text><text x="378" y="249" text-anchor="middle" class="body">상품 식별값을 포함한 응답</text><text x="378" y="270" text-anchor="middle" class="body"></text><rect x="516" y="190" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="622" y="223" text-anchor="middle" class="label">응답 해석·검사</text><text x="622" y="249" text-anchor="middle" class="body">빈 응답·식별값 누락 확인</text><text x="622" y="270" text-anchor="middle" class="body"></text><rect x="760" y="190" width="212" height="96" rx="14" fill="#fff7ed" stroke="#cbd5e1"/><text x="866" y="223" text-anchor="middle" class="label">오류 안내</text><text x="866" y="249" text-anchor="middle" class="body">해석·연동 실패를 화면에 표시</text><text x="866" y="270" text-anchor="middle" class="body"></text><rect x="516" y="340" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="622" y="373" text-anchor="middle" class="label">상품 정보 연결</text><text x="622" y="399" text-anchor="middle" class="body">카탈로그에서 상품명·가격 확인</text><text x="622" y="420" text-anchor="middle" class="body"></text><rect x="272" y="340" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="378" y="373" text-anchor="middle" class="label">추천 결과 표시</text><text x="378" y="399" text-anchor="middle" class="body">부품 목록과 합계 금액 표시</text><text x="378" y="420" text-anchor="middle" class="body"></text><rect x="28" y="340" width="212" height="96" rx="14" fill="white" stroke="#cbd5e1"/><text x="134" y="373" text-anchor="middle" class="label">견적 저장</text><text x="134" y="399" text-anchor="middle" class="body">로그인한 사용자의 견적 저장</text><text x="134" y="420" text-anchor="middle" class="body">장바구니 연계용 견적 ID 제공</text><path d="M240 238 H268" class="line" marker-end="url(#arrow)"/><path d="M484 238 H512" class="line" marker-end="url(#arrow)"/><path d="M728 238 H756" class="line" marker-end="url(#arrow)"/><path d="M378 161 V186" class="line" marker-end="url(#arrow)"/><path d="M622 286 V336" class="line" marker-end="url(#arrow)"/><path d="M516 388 H488" class="line" marker-end="url(#arrow)"/><path d="M272 388 H244" class="line" marker-end="url(#arrow)"/></svg>